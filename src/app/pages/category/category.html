<div class="gallery-page">

  <!-- TOP BAR -->
  <div class="top-bar">

    <a routerLink="/" class="back-btn">
      ← Back To Home
    </a>

    <h1>
      {{ category | titlecase }} Collection
    </h1>

  </div>


  <!-- IMAGE GRID -->
  <div class="gallery-grid">

    <div
      class="gallery-card"
      *ngFor="let image of images; let i = index"
      (click)="openImage(image, i)"
    >

      <img
        [src]="image"
        alt="Jewellery Image"
      />

    </div>

  </div>


  <!-- FULLSCREEN VIEWER -->
  <div
    class="image-viewer"
    *ngIf="isViewerOpen"
    (click)="closeViewer()"
  >

    <!-- CLOSE BUTTON -->
    <button
      class="close-viewer"
      (click)="closeViewer(); $event.stopPropagation()"
      aria-label="Close"
    >
      ×
    </button>


    <!-- PREVIOUS IMAGE -->
    <button
      class="navigation-btn previous-btn"
      (click)="previousImage(); $event.stopPropagation()"
      aria-label="Previous Image"
    >
      ❮
    </button>


    <!-- IMAGE -->
    <img
      [src]="selectedImage"
      class="viewer-image"
      alt="Jewellery Image"
      (click)="$event.stopPropagation()"
    />


    <!-- NEXT IMAGE -->
    <button
      class="navigation-btn next-btn"
      (click)="nextImage(); $event.stopPropagation()"
      aria-label="Next Image"
    >
      ❯
    </button>


    <!-- DOWNLOAD BUTTON -->
    <a
      [href]="selectedImage"
      download
      class="download-btn"
      (click)="$event.stopPropagation()"
    >
      ⬇ Download
    </a>

  </div>

</div>
